version: 2

updates:
  # Bun workspaces (root lockfile covers apps/* and packages/*).
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Africa/Cairo"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      bun-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "mix"
    directory: "/services/event-broker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Africa/Cairo"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      broker-mix-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "mix"
    directory: "/services/chat-service"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Africa/Cairo"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      chat-mix-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Africa/Cairo"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
