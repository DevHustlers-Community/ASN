name: Broker

on:
  pull_request:
    paths:
      - 'services/event-broker/**'
      - 'infrastructure/postgres/**'
      - 'compose.yaml'
      - '.tool-versions'
      - '.github/workflows/broker.yml'
  push:
    branches:
      - main
    paths:
      - 'services/event-broker/**'
      - 'infrastructure/postgres/**'
      - 'compose.yaml'
      - '.tool-versions'
      - '.github/workflows/broker.yml'

env:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  ASN_DB_PASSWORD: postgres
  PGHOST: localhost
  PGUSER: postgres
  PGPASSWORD: postgres
  BROKER_DATABASE_URL: postgres://asn_broker:postgres@localhost:5432/broker_db
  BROKER_TEST_DATABASE_URL: postgres://asn_broker:postgres@localhost:5432/broker_db_test

jobs:
  broker:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.4'
          otp-version: '29.1.2'

      - name: Create service roles and databases
        run: sh infrastructure/postgres/init/01-create-databases.sh

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            services/event-broker/deps
            services/event-broker/_build
          key: broker-mix-${{ runner.os }}-${{ hashFiles('services/event-broker/mix.lock') }}
          restore-keys: |
            broker-mix-${{ runner.os }}-

      - name: Fetch dependencies
        working-directory: services/event-broker
        run: mix deps.get

      - name: Verify format, compile, and test
        working-directory: services/event-broker
        run: |
          mix ecto.create
          mix ecto.migrate
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix test --warnings-as-errors
