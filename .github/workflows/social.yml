name: Social

on:
  pull_request:
    paths:
      - 'services/social-api/**'
      - 'contracts/openapi/social-api.yaml'
      - 'contracts/events/social/**'
      - 'contracts/events/common/**'
      - 'scripts/contracts/**'
      - 'infrastructure/postgres/**'
      - 'compose.yaml'
      - '.tool-versions'
      - '.github/workflows/social.yml'
  push:
    branches: [main]
    paths:
      - 'services/social-api/**'
      - 'contracts/openapi/social-api.yaml'
      - 'contracts/events/social/**'
      - 'contracts/events/common/**'
      - 'scripts/contracts/**'
      - 'infrastructure/postgres/**'
      - 'compose.yaml'
      - '.tool-versions'
      - '.github/workflows/social.yml'

permissions:
  contents: read

concurrency:
  group: social-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  ASN_DB_PASSWORD: postgres
  PGHOST: localhost
  PGUSER: postgres
  PGPASSWORD: postgres
  SOCIAL_DATABASE_URL: postgres://asn_social:postgres@localhost:5432/social_db
  SOCIAL_TEST_DATABASE_URL: postgres://asn_social:postgres@localhost:5432/social_db_test

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.4'
          otp-version: '29.1.2'

      - name: Create service roles and databases
        run: sh infrastructure/postgres/init/01-create-databases.sh

      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            services/social-api/deps
            services/social-api/_build
          key: social-mix-${{ runner.os }}-${{ hashFiles('services/social-api/mix.lock') }}
          restore-keys: |
            social-mix-${{ runner.os }}-

      - name: Fetch dependencies
        working-directory: services/social-api
        run: mix deps.get

      - name: Verify format, compile, and test
        working-directory: services/social-api
        run: |
          mix ecto.create
          mix ecto.migrate
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix test --warnings-as-errors
